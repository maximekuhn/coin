<div class="container">
  <div>
    @if (user()) {
      <h1 i18n="Greeting text shown on home page@@home.welcome-back">Welcome back, {{ user()!.name }} !</h1>
    } @else {
      <h1 i18n="Main title for the home page in guest mode@@home.title">Welcome to coin</h1>
      <p i18n="Tells the user to login to start using the application@@home.login">Login to your account to start sharing expenses !</p>
    }
  </div>
</div>
