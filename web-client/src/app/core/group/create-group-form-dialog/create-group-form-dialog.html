<form [formGroup]="createGroupForm" (ngSubmit)="createGroup()">
  <h2 i18n="Create new group form title@@create-group.form.title">New group</h2>
  <mat-form-field>
    <mat-label i18n="Input field for the new group name in the form to create a new group@@create-group.form.name">Name</mat-label>
    <input matInput type="text" placeholder="My awesome group" formControlName="name" required />
  </mat-form-field>
  <button matButton="filled" type="button" (click)="createGroup()" [disabled]="!canSubmit()" i18n="Create new group form submit button@@create-group.form.submit">Create</button>
</form>
