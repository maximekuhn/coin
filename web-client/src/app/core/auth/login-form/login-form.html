<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <h2 i18n="Login form title@@login.form.title">Login to your account</h2>
  <mat-form-field>
    <mat-label i18n="Email field for the login form@@login.form.email">Enter your email</mat-label>
    <input matInput type="email" placeholder="pat@example.com" formControlName="email" required />
  </mat-form-field>
  <mat-form-field>
    <mat-label i18n="Password field for the login form@@login.form.password">Password</mat-label>
    <input
      matInput
      [type]="hidePassword() ? 'password' : 'text'"
      placeholder="********"
      formControlName="password"
      required
    />
    <button matIconButton matSuffix type="button" (click)="toggleHidePassword($event)">
      <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
  </mat-form-field>
  <div class="bottom">
    <p i18n="Small text displayed below the login form to go to the register form@@login.form.no-account">No account ? <a routerLink="#TODO">Register</a></p>
    <button matButton="filled" type="submit" [disabled]="!canSubmit()" i18n="Login form submit button@@login.form.submit">Login</button>
  </div>
</form>
